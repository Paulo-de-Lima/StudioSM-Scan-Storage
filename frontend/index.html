<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b83c6f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>StudioSM · Estoque</title>
    <script>
      // Aplica o tema antes de desenhar a página, evitando um "piscar" do tema claro.
      try {
        var t = localStorage.getItem('studiosm-tema')
        if (t !== 'claro' && t !== 'escuro')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'
        document.documentElement.dataset.tema = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
